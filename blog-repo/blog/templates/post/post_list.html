{% extends 'layouts/post_layout.html' %}

{% block title %} Post {% endblock title %}


{% block content %}
  
  {% for post in posts %}

  <form method="get">
    <div>
      {{filter_form.search_query}}
    </div>
    <div>
      {{filter_form.order_by}}
    </div>

  </form>





  <p>{{post.list}}</p>
  <p>{{post.content}}</p>
  <p>{{post.author}}</p>
    
  {% endfor %}
    
{% endblock content %}
